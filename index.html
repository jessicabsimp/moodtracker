<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mood Tracker</h1>
        <form id="moodForm">
            <label for="mood">Mood:</label>
            <button type="button" name="mood" value="Great">Great</button>
            <button type="button" name="mood" value="Good">Good</button>
            <button type="button" name="mood" value="Okay">Okay</button>
            <button type="button" name="mood" value="Bad">Bad</button>
            <button type="button" name="mood" value="Terrible">Terrible</button>

            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes"></textarea>

            <label for="dateTime">Date and Time:</label>
            <input type="datetime-local" id="dateTime" name="dateTime" value="">

            <button type="submit" id="saveEntry">Save Entry</button>
        </form>

        <div id="history"></div>
        <div id="summary"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
